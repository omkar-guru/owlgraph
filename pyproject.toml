[project]
name = "sggpipeline"
version = "0.1.0"
description = "Open-vocabulary detection, relationship prediction, and tracking research"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.9",
    "torchvision",
    "transformers>=4.50",
    "numpy",
    "scipy",
    "pyarrow",
    "pillow",
    "opencv-python-headless",
    "av",
    "onnx",
    "tensorrt",
    "cuda-python",
    "pycocotools",
    "tqdm",
    "pyyaml",
    "markitdown[docx]>=0.1.7",
    "nvidia-modelopt[onnx]>=0.46",
    "ultralytics>=8.4.165",
]

[project.scripts]
sgg = "sggpipeline.cli:main"

[project.optional-dependencies]
tracking = [
    "lap>=0.5.12,<0.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "sggpipeline"
